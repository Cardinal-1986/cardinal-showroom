name: Sanity check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # index.html here is the SHOWROOM's, not Cardinal's. The modules are external
  # files, so the external-script gate is not prophylactic in this repo — it is
  # the check that catches a broken showcase.js before it deploys.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: index.html exists and is not truncated
        run: |
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          tail -c 200 index.html | grep -q "</html>" || { echo "::error::truncated"; exit 1; }

      - name: Every inline script parses
        run: |
          node -e "
            const fs=require('fs'); const src=fs.readFileSync('index.html','utf8');
            const b=[...src.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!b.length){console.error('::error::no inline scripts');process.exit(1);}
            let bad=0; b.forEach((x,i)=>{try{new Function(x)}catch(e){bad++;console.error('::error::inline #'+i+': '+e.message)}});
            if(bad)process.exit(1); console.log('all '+b.length+' inline scripts parse');
          "

      # The whole point of this repo: the modules are FILES now.
      - name: External <script src> files parse and exist
        run: |
          node .claude/skills/cardinal-build/scripts/check_external_scripts.mjs --selftest
          node .claude/skills/cardinal-build/scripts/check_external_scripts.mjs index.html

      - name: API functions use ES modules
        run: |
          if [ -d api ]; then
            BAD=$(grep -l 'module\.exports' api/*.js 2>/dev/null || true)
            if [ -n "$BAD" ]; then echo "::error::CommonJS in api/ breaks every function"; echo "$BAD"; exit 1; fi
            for f in api/*.js; do node --check "$f"; done
          fi

      # ⚠ THE CHECK THAT WOULD HAVE CAUGHT THE FIRST BROKEN DEPLOY. api/detect.js
      # was copied from Cardinal without its sibling `_staff.js`, so the function
      # crashed at MODULE LOAD — FUNCTION_INVOCATION_FAILED on every request,
      # including a GET that should have been a plain 405. `node --check` above
      # cannot see it: the file parses perfectly, it just imports something that
      # is not there. Nothing else in this repo looks at a route's imports.
      #
      # Copying a serverless route is not copying the route: its siblings, its
      # dependencies and its vercel.json budget all travel with it.
      - name: Every local import in api/ resolves
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            if(!fs.existsSync('api')){console.log('no api/');process.exit(0);}
            let bad=0,n=0;
            for(const f of fs.readdirSync('api').filter(x=>x.endsWith('.js'))){
              const s=fs.readFileSync('api/'+f,'utf8');
              for(const m of s.matchAll(/^\s*import[^'\"]*['\"](\.[^'\"]+)['\"]/gm)){
                n++;
                if(!fs.existsSync(path.join('api',m[1]))){
                  bad++; console.error('::error::'+f+' imports '+m[1]+' which is not in this repo - the function will fail at load');
                }
              }
            }
            if(bad)process.exit(1);
            console.log(n+' local import(s) in api/, all resolve');
          "

      # ⚠ THE FENCE THAT MAKES THIS A SEPARATE APPLICATION. Trigger 1 is not
      # satisfied by files living in their own repo if CRM code follows them
      # here. Same shape as gate_807 for the Visualizer.
      - name: No CRM code in the Showroom
        run: |
          node -e "
            const fs=require('fs');
            const files=['index.html','showcase.js','colors.js','showroom-images.js'];
            const BAN=[/CardinalPipeline/,/cardinalTruthView/,/resourceLibraryView/,/is_full_access/,
                       /crmNow\s*\(/,/data-crm=/,/normStage\s*\(/,/bidAmt\s*\(/];
            let bad=0;
            for(const f of files){ if(!fs.existsSync(f)) continue;
              const s=fs.readFileSync(f,'utf8');
              for(const re of BAN) if(re.test(s)){ bad++; console.error('::error::CRM marker '+re+' found in '+f); } }
            if(bad)process.exit(1); console.log('no CRM markers in '+files.length+' files');
          "

      # ⚠ THE MOUNT DIVS MUST NOT EXIST IN THIS FILE. Both relocated modules are
      # self-mounting and take zero DOM anchors from outside. Providing one is
      # not neutral: OC Colors' ensureView() ADOPTS an existing cr-occ element
      # and returns early, so its scaffold is never built - the module renders
      # nothing and then dies on a missing occTitle. A black screen caused
      # entirely by the anchor being present. This shipped once.
      - name: The modules mount themselves - no pre-created anchors
        run: |
          node -e "
            const s=require('fs').readFileSync('index.html','utf8');
            const bad=[...s.matchAll(/<[a-z]+[^>]*\\bid=[\"'](cr-show|cr-occ)[\"'][^>]*>/gi)];
            if(bad.length){
              for(const m of bad) console.error('::error::index.html pre-creates '+m[1]+' - the module will adopt it and never build its own scaffold');
              process.exit(1);
            }
            console.log('no pre-created module mounts');
          "

      - name: No secret ever committed here
        run: |
          # The publishable anon key is public by design and expected. A
          # service-role key bypasses every RLS policy and must never appear.
          #
          # The scanner matches the VALUE SHAPE, never the words. Its first
          # version grepped this file for 'service_role' and so failed on the
          # file that defined it, on every push, having never once passed.
          # The selftest runs first: a scanner never seen to fail is not
          # evidence, and this one was green-hatted red for five commits.
          node .github/scan_secret.js --selftest
          node .github/scan_secret.js

  # ─────────────────────────────────────────────────────────────────────────
  # The sentinel, ratcheted. Separate job because it needs Chromium and takes
  # minutes, and because a slow job attached to the fast one gets skipped.
  #
  # ⚠ IT RUNS ON EVERY PUSH, and it is not advisory here. Five of the six
  # defects this app shipped with on 31 Aug were invisible to every mechanical
  # check in the job above — four of them live one click past the sign-in form
  # and one only at a phone width. That is the gap this job exists to close.
  #
  # Known debt is written down in sentinel_baseline.json WITH A REASON and
  # blocks nothing; anything new is red the build it lands.
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Chromium
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium

      # The instrument first. Two of its own checks were incapable of firing
      # when written, and two MORE were found reporting correct code as broken
      # on this repo's first sweep. Silence from an instrument never seen to
      # speak is not evidence.
      - name: The sentinel's own selftest
        run: node .claude/skills/cardinal-build/scripts/sentinel.js --selftest

      # And the gate's selftest: against an empty baseline the same sweep must
      # come back RED, or the comparison is comparing nothing.
      - name: The gate can go red
        run: |
          cp .claude/skills/cardinal-build/scripts/sentinel_baseline.json /tmp/baseline.bak
          echo '{}' > .claude/skills/cardinal-build/scripts/sentinel_baseline.json
          node .claude/skills/cardinal-build/scripts/gate_sentinel.mjs --selftest
          cp /tmp/baseline.bak .claude/skills/cardinal-build/scripts/sentinel_baseline.json

      - name: Sentinel sweep — 13 states x 4 viewports
        run: node .claude/skills/cardinal-build/scripts/gate_sentinel.mjs
